<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇 트래픽 분석 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .upload-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .upload-section input[type="file"] {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-download {
            background: #4caf50;
            color: white;
        }
        
        .btn-download:hover {
            background: #45a049;
        }
        
        .btn-secondary {
            background: #2196F3;
            color: white;
            font-size: 12px;
            padding: 8px 15px;
        }
        
        .btn-secondary:hover {
            background: #0b7dda;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-value.danger {
            color: #f44336;
        }
        
        .stat-value.success {
            color: #4caf50;
        }
        
        .verdict-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            border-left: 5px solid;
        }
        
        .verdict-card.safe {
            border-left-color: #4caf50;
            background: #f1f8f4;
        }
        
        .verdict-card.danger {
            border-left-color: #f44336;
            background: #fdf5f5;
        }
        
        .verdict-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .verdict-card.safe .verdict-title {
            color: #4caf50;
        }
        
        .verdict-card.danger .verdict-title {
            color: #f44336;
        }
        
        .verdict-text {
            color: #666;
            font-size: 14px;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .map-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 600px;
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            max-height: 600px;
            overflow-y: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            position: sticky;
            top: 0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .ip-cell {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        
        .ip-cell:hover {
            text-decoration: underline;
            color: #5568d3;
        }
        
        .status-safe {
            color: #4caf50;
            font-weight: 600;
        }
        
        .status-danger {
            color: #f44336;
            font-weight: 600;
        }
        
        .google-maps-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .google-maps-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }
        
        .link-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .link-input-group input {
            flex: 1;
            min-width: 300px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .link-display {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
        
        .link-display a {
            color: #2e7d32;
            font-weight: 600;
            word-break: break-all;
            text-decoration: none;
        }
        
        .link-display a:hover {
            text-decoration: underline;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>로봇 트래픽 분석 대시보드</h1>
            <p>세계지도 + Google My Maps 연동</p>
        </div>

        <div class="upload-section">
            <input type="file" id="csvFile" accept=".csv" placeholder="robot_traffic_analyzed.csv 선택">
            <button class="btn btn-primary" onclick="analyzeFile()">📊 분석하기</button>
            <button class="btn btn-download" id="downloadBtn" onclick="downloadReport()" style="display:none;">📥 PDF 다운로드</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>분석 중...</p>
        </div>

        <div id="results" class="hidden">
            <div class="stats-grid" id="statsGrid"></div>
            
            <div id="verdictCard"></div>

            <div class="main-grid">
                <div class="map-container">
                    <div id="googleMapsEmbed" style="width: 100%; height: 100%; display: none;"></div>
                    <div id="map" style="display: block;"></div>
                </div>
                <div class="table-container">
                    <table id="dataTable" style="display:none;">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>IP 주소</th>
                                <th>국가</th>
                                <th>도시</th>
                                <th>패킷수</th>
                                <th>판정</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Google My Maps 연동 섹션 (초기 화면에서도 표시) -->
        <div>
            <div class="google-maps-section">
                <h2>🗺️ Google My Maps 연동</h2>
                
                <p style="margin-bottom: 15px; font-size: 13px;">
                    <a href="https://mymaps.google.com" target="_blank" rel="noopener noreferrer" style="color: #667eea; font-weight: 600; text-decoration: none;">🔗 Google My Maps 바로가기</a>
                </p>

                <div class="link-input-group">
                    <input type="text" id="googleMapsLink" placeholder="Google My Maps 공유 링크 (https://www.google.com/maps/d/e/...)" />
                    <button class="btn btn-secondary" onclick="addGoogleMapsLink()" style="padding: 12px 20px;">✅ 지도 추가</button>
                </div>

                <div class="link-display" id="linkDisplay">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <p style="margin: 0; font-size: 12px; color: #2e7d32;">✅ Google My Maps가 추가되었습니다</p>
                        <button class="btn" onclick="removeGoogleMapsLink()" style="background: #f44336; color: white; padding: 8px 12px;">🗑️ 삭제</button>
                    </div>
                    <p style="font-size: 11px; color: #f44336; margin-top: 10px;">
                        ⚠️ 삭제하면 새로고침해야 기본 지도로 돌아갑니다.
                    </p>
                </div>
            </div>
        </div>

        <div id="errorMsg"></div>
    </div>

    <script>
        let map;
        let allData = [];
        let markersLayer = null;

        // 페이지 로드 시 저장된 Google My Maps 복원
        window.addEventListener('load', function() {
            restoreGoogleMapsLink();
        });

        function analyzeFile() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) {
                showError('CSV 파일을 선택하세요');
                return;
            }

            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('errorMsg').innerHTML = '';

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const csv = e.target.result;
                    const lines = csv.split('\n');
                    
                    if (lines.length < 2) {
                        showError('CSV 파일이 비어있습니다');
                        return;
                    }

                    const header = lines[0].split(',').map(h => h.trim());
                    const ipIdx = header.findIndex(h => h.includes('도착지_IP'));
                    const countryIdx = header.findIndex(h => h.includes('국가') && !h.includes('국가코드'));
                    const cityIdx = header.findIndex(h => h.includes('도시'));
                    const latIdx = header.findIndex(h => h.includes('위도'));
                    const lonIdx = header.findIndex(h => h.includes('경도'));
                    const packetIdx = header.findIndex(h => h.includes('패킷수'));
                    const verdictIdx = header.findIndex(h => h.includes('판정'));

                    if (ipIdx === -1 || countryIdx === -1) {
                        showError('CSV 형식이 맞지 않습니다');
                        return;
                    }

                    allData = [];
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        
                        const cols = parseCSV(lines[i]);
                        const data = {
                            ip: cols[ipIdx] || '',
                            country: countryIdx >= 0 ? cols[countryIdx] : 'Unknown',
                            city: cityIdx >= 0 ? cols[cityIdx] : 'N/A',
                            lat: latIdx >= 0 ? parseFloat(cols[latIdx]) : null,
                            lon: lonIdx >= 0 ? parseFloat(cols[lonIdx]) : null,
                            packets: packetIdx >= 0 ? parseInt(cols[packetIdx]) : 0,
                            verdict: verdictIdx >= 0 ? cols[verdictIdx] : 'Unknown'
                        };
                        
                        if (data.ip && data.lat && data.lon) {
                            allData.push(data);
                        }
                    }

                    displayResults();
                    document.getElementById('loading').classList.remove('show');
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('downloadBtn').style.display = 'inline-block';

                } catch (error) {
                    showError('파일 분석 오류: ' + error.message);
                    document.getElementById('loading').classList.remove('show');
                }
            };
            reader.readAsText(file);
        }

        function parseCSV(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        function displayResults() {
            const totalPackets = allData.reduce((sum, d) => sum + d.packets, 0);
            const chinaCount = allData.filter(d => d.verdict.includes('❌')).length;
            const safeCount = allData.filter(d => d.verdict.includes('✅')).length;
            const isSafe = chinaCount === 0;

            const statsHTML = `
                <div class="stat-card">
                    <h3>총 패킷</h3>
                    <div class="stat-value">${totalPackets.toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <h3>고유 도착지</h3>
                    <div class="stat-value">${allData.length}</div>
                </div>
                <div class="stat-card">
                    <h3>안전 (✅)</h3>
                    <div class="stat-value success">${safeCount}</div>
                </div>
                <div class="stat-card">
                    <h3>위험 (❌)</h3>
                    <div class="stat-value danger">${chinaCount}</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHTML;

            const verdictClass = isSafe ? 'safe' : 'danger';
            const verdictHTML = `
                <div class="verdict-card ${verdictClass}">
                    <div class="verdict-title">${isSafe ? '✅ 안전 판정' : '❌ 위험 판정'}</div>
                    <div class="verdict-text">
                        ${isSafe ? 
                            '로봇이 중국 서버로 통신하지 않습니다. 설치 승인 가능합니다.' :
                            `중국 서버 ${chinaCount}개로 통신합니다. 제조사에 확인이 필요합니다.`
                        }
                    </div>
                </div>
            `;
            document.getElementById('verdictCard').innerHTML = verdictHTML;

            initializeMap();
            updateTableDisplay();
        }

        function initializeMap() {
            if (!map) {
                map = L.map('map').setView([20, 0], 2);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);
                markersLayer = L.featureGroup().addTo(map);
            } else {
                markersLayer.clearLayers();
            }

            allData.forEach(data => {
                const isSafe = data.verdict.includes('✅');
                const color = isSafe ? '#2196F3' : '#f44336';
                
                const popupText = `
                    <div style="font-size: 12px;">
                        <strong>${data.country}</strong><br>
                        도시: ${data.city}<br>
                        IP: ${data.ip}<br>
                        패킷: ${data.packets.toLocaleString()}개<br>
                        판정: ${data.verdict}
                    </div>
                `;

                L.circleMarker([data.lat, data.lon], {
                    radius: 8,
                    fillColor: color,
                    color: 'white',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).bindPopup(popupText).addTo(markersLayer);
            });
        }

        function updateTableDisplay() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            allData.sort((a, b) => b.packets - a.packets).forEach((data, idx) => {
                const isSafe = data.verdict.includes('✅');
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td>${idx + 1}</td>
                    <td><span class="ip-cell" onclick="zoomToIP('${data.ip}', ${data.lat}, ${data.lon})" title="클릭하면 지도에서 표시됩니다">${data.ip}</span></td>
                    <td>${data.country}</td>
                    <td>${data.city}</td>
                    <td>${data.packets.toLocaleString()}</td>
                    <td class="${isSafe ? 'status-safe' : 'status-danger'}">${data.verdict}</td>
                `;
            });
            document.getElementById('dataTable').style.display = 'table';
        }

        function zoomToIP(ip, lat, lon) {
            if (map) {
                map.setView([lat, lon], 6);
                
                const popup = `
                    <div style="font-size: 12px;">
                        <strong>IP: ${ip}</strong><br>
                        위치: (${lat.toFixed(4)}, ${lon.toFixed(4)})
                    </div>
                `;
                
                L.popup()
                    .setLatLng([lat, lon])
                    .setContent(popup)
                    .openOn(map);
            }
        }

        function addGoogleMapsLink() {
            const link = document.getElementById('googleMapsLink').value.trim();
            if (!link) {
                alert('Google My Maps 공유 링크를 붙여넣으세요');
                return;
            }

            if (!link.includes('google.com/maps/d')) {
                alert('유효한 Google My Maps 공유 링크를 붙여넣으세요\n\n예: https://www.google.com/maps/d/e/1MCY7XbW5...');
                return;
            }

            // localStorage에 저장
            localStorage.setItem('googleMapsLink', link);
            
            // 링크를 iframe src로 변환해서 임베드
            convertAndEmbedGoogleMaps(link);
            
            // UI 업데이트
            const linkDisplay = document.getElementById('linkDisplay');
            linkDisplay.style.display = 'block';
            
            alert('✅ Google My Maps가 지도에 추가되었습니다!\n\n새로고침해도 유지됩니다.');
        }

        function convertAndEmbedGoogleMaps(link) {
            const googleMapsEmbed = document.getElementById('googleMapsEmbed');
            const map = document.getElementById('map');
            
            // 공유 링크를 embed URL로 변환
            // 편집/보기/공유 링크 어떤 형식이든 mid 값을 뽑아 임베드 전용 URL로 변환
            // (edit?mid=..., viewer?mid=..., /d/u/0/edit?mid=... 모두 지원)
            let embedUrl = link;
            try {
                const midMatch = link.match(/[?&]mid=([^&#]+)/);
                if (midMatch) {
                    embedUrl = 'https://www.google.com/maps/d/embed?mid=' + midMatch[1];
                    const ll = link.match(/[?&]ll=([^&#]+)/);
                    const z = link.match(/[?&]z=([^&#]+)/);
                    if (ll) embedUrl += '&ll=' + ll[1];
                    if (z) embedUrl += '&z=' + z[1];
                }
            } catch (e) {
                embedUrl = link;
            }
            
            // Leaflet 지도 숨기기
            map.style.display = 'none';
            
            // iframe HTML 생성
            const iframeHTML = `
                <iframe 
                    src="${embedUrl}" 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    style="border: none; border-radius: 12px;">
                </iframe>
            `;
            
            googleMapsEmbed.innerHTML = iframeHTML;
            googleMapsEmbed.style.display = 'block';
        }

        function restoreGoogleMapsLink() {
            const savedLink = localStorage.getItem('googleMapsLink');
            if (savedLink) {
                document.getElementById('googleMapsLink').value = savedLink;
                
                // 지도에 임베드
                convertAndEmbedGoogleMaps(savedLink);
                
                // UI 업데이트
                const linkDisplay = document.getElementById('linkDisplay');
                linkDisplay.style.display = 'block';
            }
        }

        function removeGoogleMapsLink() {
            if (confirm('Google My Maps를 삭제하시겠습니까?\n\n삭제 후 기본 지도로 돌아갑니다.')) {
                localStorage.removeItem('googleMapsLink');
                
                const googleMapsEmbed = document.getElementById('googleMapsEmbed');
                const map = document.getElementById('map');
                const linkDisplay = document.getElementById('linkDisplay');
                const input = document.getElementById('googleMapsLink');
                
                googleMapsEmbed.style.display = 'none';
                googleMapsEmbed.innerHTML = '';
                
                map.style.display = 'block';
                linkDisplay.style.display = 'none';
                input.value = '';
                
                alert('✅ Google My Maps가 삭제되었습니다.\n\n기본 지도가 표시됩니다.');
            }
        }

        function downloadReport() {
            // PDF 콘텐츠 생성
            const totalPackets = allData.reduce((sum, d) => sum + d.packets, 0);
            const chinaCount = allData.filter(d => d.verdict.includes('❌')).length;
            const safeCount = allData.filter(d => d.verdict.includes('✅')).length;
            const isSafe = chinaCount === 0;
            
            const sortedData = allData.sort((a, b) => b.packets - a.packets);
            const rowsPerPage = 10;
            const totalPages = Math.ceil(sortedData.length / rowsPerPage);

            let reportHTML = `
                <div style="font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 40px;">
                    <!-- 제목 (페이지 1) -->
                    <div style="text-align: center; margin-bottom: 50px; border-bottom: 3px solid #667eea; padding-bottom: 20px;">
                        <h1 style="color: #333; margin: 0; font-size: 32px;">로봇 트래픽 분석 보고서</h1>
                        <p style="color: #999; margin: 10px 0 0 0;">Robot Network Traffic Analysis Report</p>
                        <p style="color: #999; margin: 5px 0 0 0; font-size: 12px;">생성일: ${new Date().toLocaleDateString('ko-KR')}</p>
                    </div>

                    <!-- Executive Summary -->
                    <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
                        <h2 style="color: #333; margin-top: 0; font-size: 18px;">📊 Executive Summary</h2>
                        <p style="color: #666; margin: 10px 0;">
                            ${isSafe ? 
                                '로봇이 중국 서버로 통신하지 않으며, 모든 트래픽이 신뢰할 수 있는 서버로 향합니다. 설치 승인이 가능합니다.' :
                                `중국 내부 서버로 향하는 트래픽이 ${chinaCount}개 발견되었습니다. 제조사의 보안 확인이 필요합니다.`
                            }
                        </p>
                    </div>

                    <!-- 통계 -->
                    <div style="margin-bottom: 30px;">
                        <h2 style="color: #333; font-size: 18px; margin-top: 0;">📈 통계 분석</h2>
                        <table style="width: 100%; border-collapse: collapse; page-break-inside: avoid;">
                            <tr style="background: #667eea; color: white;">
                                <td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">항목</td>
                                <td style="padding: 12px; border: 1px solid #ddd; font-weight: bold;">값</td>
                            </tr>
                            <tr style="background: #f9f9f9;">
                                <td style="padding: 12px; border: 1px solid #ddd;">총 패킷 수</td>
                                <td style="padding: 12px; border: 1px solid #ddd; font-weight: bold; font-size: 14px;">${totalPackets.toLocaleString()} 개</td>
                            </tr>
                            <tr>
                                <td style="padding: 12px; border: 1px solid #ddd;">고유 도착지</td>
                                <td style="padding: 12px; border: 1px solid #ddd; font-weight: bold; font-size: 14px;">${allData.length} 개</td>
                            </tr>
                            <tr style="background: #f9f9f9;">
                                <td style="padding: 12px; border: 1px solid #ddd;">안전 (✅)</td>
                                <td style="padding: 12px; border: 1px solid #ddd; color: #4caf50; font-weight: bold; font-size: 14px;">${safeCount} 개</td>
                            </tr>
                            <tr>
                                <td style="padding: 12px; border: 1px solid #ddd;">위험 (❌)</td>
                                <td style="padding: 12px; border: 1px solid #ddd; color: #f44336; font-weight: bold; font-size: 14px;">${chinaCount} 개</td>
                            </tr>
                        </table>
                    </div>

                    <!-- 최종 판정 -->
                    <div style="background: ${isSafe ? '#e8f5e9' : '#ffebee'}; border-left: 5px solid ${isSafe ? '#4caf50' : '#f44336'}; padding: 20px; margin-bottom: 30px; border-radius: 4px; page-break-inside: avoid;">
                        <h2 style="margin-top: 0; color: ${isSafe ? '#2e7d32' : '#c62828'}; font-size: 18px;">
                            ${isSafe ? '✅ 안전 판정' : '❌ 위험 판정'}
                        </h2>
                        <p style="color: #333; margin: 10px 0; line-height: 1.6;">
                            ${isSafe ? 
                                '로봇의 트래픽이 안전한 서버로만 향합니다. 중국 경유 통신이 없으므로 현장 설치가 승인됩니다.' :
                                `로봇이 중국 내부 서버로 통신합니다. 제조사에 이에 대한 확인을 요청하고, 보안 승인 전 조치가 필요합니다.`
                            }
                        </p>
                    </div>
            `;
            
            // 데이터를 페이지별로 나누기
            for (let page = 0; page < totalPages; page++) {
                const startIdx = page * rowsPerPage;
                const endIdx = Math.min(startIdx + rowsPerPage, sortedData.length);
                const pageData = sortedData.slice(startIdx, endIdx);
                
                reportHTML += `
                    <div style="page-break-inside: avoid; margin-bottom: 30px;">
                        <h2 style="color: #333; font-size: 18px; margin-top: 0;">📋 상세 트래픽 데이터 (${page + 1}/${totalPages})</h2>
                        <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                            <tr style="background: #667eea; color: white;">
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">#</td>
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">IP</td>
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">국가</td>
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">도시</td>
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">패킷</td>
                                <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">판정</td>
                            </tr>
                            ${pageData.map((data, idx) => `
                                <tr style="background: ${(startIdx + idx) % 2 === 0 ? '#f9f9f9' : 'white'}; page-break-inside: avoid;">
                                    <td style="padding: 8px; border: 1px solid #ddd;">${startIdx + idx + 1}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd; font-family: monospace; font-size: 10px;">${data.ip}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${data.country}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${data.city}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd; text-align: right;">${data.packets.toLocaleString()}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd; color: ${data.verdict.includes('✅') ? '#4caf50' : '#f44336'}; font-weight: bold; font-size: 10px;">${data.verdict}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                `;
            }

            // 마지막 페이지: 서명란
            reportHTML += `
                    <!-- 서명란 -->
                    <div style="margin-top: 50px; border-top: 1px solid #ddd; padding-top: 30px; page-break-inside: avoid;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <tr>
                                <td style="width: 30%; padding: 20px; text-align: center; border: 1px solid #ddd;">
                                    <p style="margin: 0; color: #999; font-size: 12px;">검증자 서명</p>
                                    <div style="height: 40px; margin: 10px 0;"></div>
                                    <p style="margin: 0; color: #333; font-size: 11px;">성명: _______</p>
                                </td>
                                <td style="width: 30%; padding: 20px; text-align: center; border: 1px solid #ddd;">
                                    <p style="margin: 0; color: #999; font-size: 12px;">보안팀장 서명</p>
                                    <div style="height: 40px; margin: 10px 0;"></div>
                                    <p style="margin: 0; color: #333; font-size: 11px;">성명: _______</p>
                                </td>
                                <td style="width: 40%; padding: 20px; text-align: center; border: 1px solid #ddd;">
                                    <p style="margin: 0; color: #999; font-size: 12px;">승인 서명</p>
                                    <div style="height: 40px; margin: 10px 0;"></div>
                                    <p style="margin: 0; color: #333; font-size: 11px;">성명: _______</p>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            `;

            const opt = {
                margin: 10,
                filename: `로봇트래픽분석보고서_${new Date().toISOString().slice(0, 10)}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(reportHTML).save();
        }

        function showError(msg) {
            document.getElementById('errorMsg').innerHTML = `<div class="error">❌ ${msg}</div>`;
            document.getElementById('loading').classList.remove('show');
        }
    </script>
</body>
</html>
